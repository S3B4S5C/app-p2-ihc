<div class="shell">
  <header class="shell-header">
    <a class="shell-brand" routerLink="/mis-mascotas" aria-label="Ir a Mis Mascotas">
      <span aria-hidden="true">🐾</span><span>Mascotas al Día</span>
    </a>
    <div class="shell-actions">
      <app-theme-toggle />
      <div class="menu-wrap">
        <button class="menu-button" type="button" (click)="toggleMenu($event)" [attr.aria-expanded]="menuOpen()" aria-label="Abrir menú">☰</button>
        @if (menuOpen()) {
          <nav class="menu" (click)="$event.stopPropagation()" aria-label="Navegación principal">
            <div class="menu__user">
              <strong>{{ auth.user()?.fullName }}</strong>
              <span>{{ auth.user()?.email }}</span>
            </div>
            <a routerLink="/mis-mascotas" routerLinkActive="menu__link--active" class="menu__link" (click)="closeMenu()">Mis Mascotas</a>
            <button type="button" class="menu__link menu__logout" (click)="logout()">Cerrar sesión</button>
          </nav>
        }
      </div>
    </div>
  </header>
  <main class="shell-content"><router-outlet /></main>
</div>
