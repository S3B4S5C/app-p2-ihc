<article class="record-card" [class.record-card--completed]="record().status === 'COMPLETED'">
  <div class="record-card__header">
    <div class="record-card__pet">
      <span class="record-card__icon">
        <app-icon name="pets" [size]="22" />
      </span>

      <div>
        <h2>{{ record().petName }}</h2>
        <span>{{ record().animalType }}</span>
      </div>
    </div>

    <time [attr.datetime]="record().careDate">
      {{ record().careDate }}
    </time>
  </div>

  <div class="record-card__care">
    <span class="record-card__label">Cuidado</span>
    <p>{{ record().care }}</p>
  </div>

  <div class="record-card__footer">
    <span
      class="record-card__status"
      [class.record-card__status--completed]="record().status === 'COMPLETED'"
    >
      <app-icon [name]="record().status === 'COMPLETED' ? 'task_alt' : 'schedule'" [size]="18" />
      {{ record().status === 'COMPLETED' ? 'Realizado' : 'Pendiente' }}
    </span>

    <div class="record-card__actions">
      <a
        class="action-button"
        [routerLink]="['/cuidados', record().id, 'editar']"
        [state]="{ record: record() }"
        [attr.aria-label]="'Editar cuidado de ' + record().petName"
      >
        <app-icon name="edit" [size]="20" />
      </a>

      <button
        type="button"
        class="action-button action-button--danger"
        [disabled]="deleting()"
        [attr.aria-label]="'Eliminar cuidado de ' + record().petName"
        (click)="confirmDelete()"
      >
        <app-icon [name]="deleting() ? 'progress_activity' : 'delete'" [size]="20" />
      </button>

      <button
        type="button"
        class="complete-button"
        [disabled]="record().status === 'COMPLETED' || completing()"
        [attr.aria-label]="record().status === 'COMPLETED' ? 'Este cuidado ya fue realizado' : 'Marcar cuidado de ' + record().petName + ' como realizado'"
        [attr.title]="record().status === 'COMPLETED' ? 'Este cuidado ya fue realizado y no puede marcarse nuevamente' : null"
        (click)="complete.emit(record().id)"
      >
        <app-icon
          [name]="completing() ? 'progress_activity' : record().status === 'COMPLETED' ? 'task_alt' : 'check'"
          [size]="22"
        />
      </button>
    </div>
  </div>
</article>
